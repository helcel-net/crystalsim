[package]
name = "flakesim"
version = "0.1.0"
edition = "2024"
description = "Grow a snow crystal from a time series of environmental conditions"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "flakesim"
required-features = ["native"]

[features]
default = ["native"]
# Command line, multi-threaded growth.
native = ["dep:clap", "dep:rayon"]
# Browser API (build with wasm-pack: `wasm-pack build --target web --no-default-features --features wasm`).
wasm = ["dep:wasm-bindgen"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"], optional = true }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
png = "0.17"
gif = "0.13"
rayon = { version = "1", optional = true }
wasm-bindgen = { version = "0.2", optional = true }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
