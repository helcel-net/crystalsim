# HISTORY — faceting and branching taking turns.
#
# Alternating humid and dry air at -15 °C: each humid spell sprouts branches,
# each dry spell lets faceting broaden the tips into plates.  The result is a
# stellar crystal whose arms carry plates part-way along — a common look in
# real snowfall, and a record of the crystal's path through the cloud.

[simulation]
radius = 1000
cell_size_um = 0.5
